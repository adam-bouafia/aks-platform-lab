name: Nightly Vulnerability Rescan

# Images don't change after they're built, but the CVE database does - a
# clean scan on build day can have new HIGH/CRITICAL findings a week later.
# This rescans the image currently on `main` every night and opens an issue
# if anything new shows up.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rescan:
    name: Rescan deployed digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rescan with Trivy
        id: scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: json
          output: trivy-nightly-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # don't fail the workflow - we want to report, not block

      - name: Count findings
        id: count
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-nightly-report.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Open an issue if new findings exist
        if: steps.count.outputs.count != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const count = "${{ steps.count.outputs.count }}";
            const sha = context.sha.substring(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly scan: ${count} HIGH/CRITICAL finding(s) on image ${sha}`,
              body: [
                `Trivy's nightly rescan of \`${process.env.REGISTRY}/${process.env.IMAGE_NAME}:${sha}\` found ${count} fixable HIGH or CRITICAL vulnerabilities that were not present at build time (new CVEs published since).`,
                "",
                "See the `trivy-nightly-report.json` artifact on this run for the full list.",
                "",
                "Triage: confirm whether the base image or a Go module needs a bump, open a PR, and close this issue once the fix merges.",
              ].join("\n"),
              labels: ["security", "vulnerability"],
            });
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-nightly-report
          path: trivy-nightly-report.json
          retention-days: 30
